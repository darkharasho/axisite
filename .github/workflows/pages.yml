name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [refresh-releases]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub does not trigger workflow runs from pushes made with the
    # default GITHUB_TOKEN, so refresh-releases's nightly commit to main
    # never fires this workflow's own `push` trigger. This `workflow_run`
    # branch is what actually redeploys after the nightly refresh; guard it
    # so a failed refresh run doesn't redeploy stale/broken data.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
