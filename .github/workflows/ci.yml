name: ci
on:
  pull_request:
  # Work also reaches main by direct push, and pages.yml deploys without
  # running tests - so without this, a pushed branch could deploy untested.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
